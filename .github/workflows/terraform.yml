name: terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "apply or destroy the dev environment"
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "1"
  TF_DIR: envs/dev

jobs:
  # Runs everywhere, no AWS account needed.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive
      - name: validate
        run: |
          for d in bootstrap envs/dev; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - name: unit tests (mocked AWS provider)
        run: |
          for m in network database app observability; do
            terraform -chdir=modules/$m init -input=false
            terraform -chdir=modules/$m test
          done
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.59.1
      - run: tflint --init && tflint --recursive
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: security scan (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"

  # Plan against the real account with the read-only role (a pull request can
  # edit this file, so it must not be able to assume anything that writes). Only
  # runs once AWS_PLAN_ROLE_ARN and TF_STATE_BUCKET are set (see README: bootstrap).
  plan:
    needs: checks
    if: vars.AWS_PLAN_ROLE_ARN != '' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for AWS, no stored keys
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.5
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1
      - run: terraform -chdir=$TF_DIR init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform -chdir=$TF_DIR plan -input=false -lock-timeout=5m -no-color | tee plan.txt
      - run: |
          {
            echo '### terraform plan (dev)'
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Manual apply/destroy, gated by the "production" environment (required reviewers).
  # Only this job's OIDC subject (environment:production) can assume the apply role.
  deploy:
    needs: checks
    if: vars.AWS_ROLE_ARN != '' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    concurrency: terraform-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.5
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
      - run: terraform -chdir=$TF_DIR init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - if: inputs.action == 'apply'
        run: terraform -chdir=$TF_DIR apply -input=false -auto-approve -lock-timeout=5m
      - if: inputs.action == 'destroy'
        run: terraform -chdir=$TF_DIR destroy -input=false -auto-approve -lock-timeout=5m
